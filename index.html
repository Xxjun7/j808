        background-attachment: fixed;

      .container {

        max-width: 500px;
        background: rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(10px);

        padding: 20px;
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);

      h2 {
        font-size: 1.4rem;
        margin-top: 0;
        margin-bottom: 20px;
        text-align: center;
        letter-spacing: 1.5px;
        font-weight: bold;

        background-size: 200% auto;
        color: transparent;
        -webkit-background-clip: text;
        background-clip: text;
        animation: shine 3s linear infinite;
        text-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
      }

      @keyframes shine {
        to {
          background-position: 200% center;
        }
      }

      .input-group {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }

      input[type="text"] {
        flex: 1;
        padding: 12px;
        font-size: 16px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
        border-radius: 8px;
        outline: none;
        transition: border-color 0.2s, background 0.2s;
        -webkit-appearance: none;
        -webkit-user-select: text;
        user-select: text;
        touch-action: manipulation;
      }

      input[type="text"]::placeholder {
        color: rgba(255, 255, 255, 0.6);
      }

      input[type="text"]:focus {
        border-color: #fcf6ba;
        background: rgba(255, 255, 255, 0.15);
      }

      button,
      .btn {
        padding: 12px 16px;
        font-size: 1rem;
        font-weight: 500;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        text-align: center;
        touch-action: manipulation;
      }

      button:active,
      .btn:active {
        transform: scale(0.98);
      }

      .btn-query {
        background: linear-gradient(135deg, #bf953f, #fcf6ba, #aa771c);
        color: #222222;
        font-weight: bold;
        box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        animation: breathe 2.5s ease-in-out infinite;
      }

      .btn-query:hover {
        background: linear-gradient(135deg, #d4af37, #fff8dc, #c5a059);
        box-shadow: 0 0 20px rgba(252, 246, 186, 0.8);
      }

      @keyframes breathe {

        0%,
        100% {
          box-shadow: 0 0 5px rgba(212, 175, 55, 0.3);
          filter: brightness(0.95);
        }

        50% {
          box-shadow: 0 0 18px rgba(252, 246, 186, 0.8);
          filter: brightness(1.08);
        }
      }

      .btn-line {
        background-color: #00c300;
        color: #ffffff;
        width: auto;
        box-sizing: border-box;
        margin-top: 16px;
        display: inline-block;
      }

      .btn-line:hover {
        background-color: #00b000;
      }

      .loading {
        display: none;
        font-size: 0.95rem;
        color: #fcf6ba;
        margin-top: 8px;
      }

      .loading::after {
        content: '';
        display: inline-block;
        animation: dots 1.5s infinite steps(4, end);
      }

      @keyframes dots {
        0% {
          content: '';
        }

        25% {
          content: '.';
        }

        50% {
          content: '..';
        }

        75% {
          content: '...';
        }
      }

      #error_message {
        color: #ff6b6b;
        font-size: 0.9rem;
        margin-top: 4px;
        display: block;
      }

      #current_time {
        display: block;
        margin-top: 16px;
        font-size: 0.9rem;
        background-image: linear-gradient(to right, #ee9ca7, #ffdde1);
        -webkit-background-clip: text;
        color: transparent;
        font-weight: bold;
      }

      .notice-box {
        margin-top: 12px;
        padding: 10px 12px;
        background: rgba(255, 255, 255, 0.08);
        border-left: 3px solid #fcf6ba;
        border-radius: 4px;
        font-size: 0.88rem;
        line-height: 1.5;
        color: #fceea7;
      }

      #order_status {
        width: 100%;
        margin-top: 16px;

      #order_status table {

        font-size: 0.95rem;
        color: #ffffff;

      }

      #order_status th {

        pointer-events: none;
