<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>臺銀美元匯率</title>
</head>
<body>

<h1>USD 即期賣出</h1>

<h2 id="rate">讀取中...</h2>

<script>
async function loadRate() {

    const data = await fetch("rate.json")
        .then(r => r.json());

    document.getElementById("rate").textContent =
        data.usdSpotSell;

}

loadRate();
</script>

</body>
</html>
