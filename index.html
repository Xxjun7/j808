<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USD 金融面板</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>💵 USD 即時匯率</h1>

<div id="status">載入中...</div>

<div class="grid">

<div class="card">
<div class="title">現金買入</div>
<div id="cash_buy" class="value">--</div>
</div>

<div class="card">
<div class="title">現金賣出</div>
<div id="cash_sell" class="value">--</div>
</div>

<div class="card">
<div class="title">即期買入</div>
<div id="spot_buy" class="value">--</div>
</div>

<div class="card">
<div class="title">即期賣出</div>
<div id="spot_sell" class="value">--</div>
</div>

</div>

<div id="time"></div>

</div>

<script src="script.js"></script>

</body>
</html>
