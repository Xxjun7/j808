<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <link rel="icon" type="image/x-icon" href="./Jicon.ico">

    <meta property="og:title" content="金正旺">
    <meta property="og:description" content="VIP查詢系統">

    <title>金正旺VIP查詢系統</title>

    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: #ffffff;
        margin: 0;
        padding: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        box-sizing: border-box;
        touch-action: pan-x pan-y;
        -webkit-user-select: none;
        user-select: none;
        background-image: url('https://lh3.googleusercontent.com/pw/AP1GczPMHaF7waxnhrEtXYsPAGS6rVI4LxOdwlTZwmrjZmMuYytOLZV1Z59x6T03KM39kRaRI1h8qe2ZpUzOTbBIS8rwn30KfhEk_cLEY8MuQutCF30OUACklEM7qO-478-XV1hYBzubTndfAkdo7_hOMf8L=w728-h1024-s-no-gm?authuser=0');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
      }

      .container {
        width: 100%;
        max-width: 500px;
        background: rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 20px;
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
        box-sizing: border-box;
        touch-action: manipulation;
      }

      h2 {
        font-size: 1.4rem;
        margin-top: 0;
        margin-bottom: 20px;
        text-align: center;
        letter-spacing: 1.5px;
        font-weight: bold;
        background: linear-gradient(90deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
        background-size: 200% auto;
        color: transparent;
        -webkit-background-clip: text;
        background-clip: text;
        animation: shine 3s linear infinite;
        text-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
      }

      @keyframes shine {
        to {
          background-position: 200% center;
        }
      }

      .input-group {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }

      input[type="text"] {
        flex: 1;
        padding: 12px;
        font-size: 16px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
        border-radius: 8px;
        outline: none;
        transition: border-color 0.2s, background 0.2s;
        -webkit-appearance: none;
        -webkit-user-select: text;
        user-select: text;
        touch-action: manipulation;
      }

      input[type="text"]::placeholder {
        color: rgba(255, 255, 255, 0.6);
      }

      input[type="text"]:focus {
        border-color: #fcf6ba;
        background: rgba(255, 255, 255, 0.15);
      }

      button,
      .btn {
        padding: 12px 16px;
        font-size: 1rem;
        font-weight: 500;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        text-align: center;
        touch-action: manipulation;
      }

      button:active,
      .btn:active {
        transform: scale(0.98);
      }

      .btn-query {
        background: linear-gradient(135deg, #bf953f, #fcf6ba, #aa771c);
        color: #222222;
        font-weight: bold;
        box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        animation: breathe 2.5s ease-in-out infinite;
      }

      .btn-query:hover {
        background: linear-gradient(135deg, #d4af37, #fff8dc, #c5a059);
        box-shadow: 0 0 20px rgba(252, 246, 186, 0.8);
      }

      @keyframes breathe {

        0%,
        100% {
          box-shadow: 0 0 5px rgba(212, 175, 55, 0.3);
          filter: brightness(0.95);
        }

        50% {
          box-shadow: 0 0 18px rgba(252, 246, 186, 0.8);
          filter: brightness(1.08);
        }
      }

      .btn-line {
        background-color: #00c300;
        color: #ffffff;
        width: auto;
        box-sizing: border-box;
        margin-top: 16px;
        display: inline-block;
      }

      .btn-line:hover {
        background-color: #00b000;
      }

      .loading {
        display: none;
        font-size: 0.95rem;
        color: #fcf6ba;
        margin-top: 8px;
      }

      .loading::after {
        content: '';
        display: inline-block;
        animation: dots 1.5s infinite steps(4, end);
      }

      @keyframes dots {
        0% {
          content: '';
        }

        25% {
          content: '.';
        }

        50% {
          content: '..';
        }

        75% {
          content: '...';
        }
      }

      #error_message {
        color: #ff6b6b;
        font-size: 0.9rem;
        margin-top: 4px;
        display: block;
      }

      #current_time {
        display: block;
        margin-top: 16px;
        font-size: 0.9rem;
        background-image: linear-gradient(to right, #ee9ca7, #ffdde1);
        -webkit-background-clip: text;
        color: transparent;
        font-weight: bold;
      }

      .notice-box {
        margin-top: 12px;
        padding: 10px 12px;
        background: rgba(255, 255, 255, 0.08);
        border-left: 3px solid #fcf6ba;
        border-radius: 4px;
        font-size: 0.88rem;
        line-height: 1.5;
        color: #fceea7;
      }

      #order_status {
        width: 100%;
        margin-top: 16px;
        overflow-x: auto;
      }

      #order_status table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
      }

      #order_status th,
      #order_status td {
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 8px;
        text-align: center;
        font-size: 0.95rem;
        color: #ffffff;
        background: rgba(255, 255, 255, 0.05);
      }

      #order_status th {
        background: rgba(255, 255, 255, 0.15);
      }

      .copyright {
        position: fixed;
        bottom: 8px;
        right: 12px;
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.5);
        letter-spacing: 0.5px;
        pointer-events: none;
        z-index: 999;
      }

      /* ========================================
         查詢中：按鈕鎖定
         ======================================== */
      .btn-query:disabled {
        cursor: not-allowed;
        opacity: 0.6;
        filter: grayscale(30%);
      }
    </style>

<script type="text/javascript">

  // ========================================
  // 全域 API 設定
  // ========================================
  let API_URL = "";
  let API_READY = false;

  // ========================================
  // 防止右鍵
  // ========================================
  document.addEventListener("contextmenu", function(e) {
    e.preventDefault();
  });


  // ========================================
  // 防止部分快捷鍵
  // ========================================
  document.addEventListener("keydown", function(e) {

    if (e.key === "F12") {
      e.preventDefault();
      return false;
    }

    if (
      e.ctrlKey &&
      e.shiftKey &&
      (
        e.key === "I" ||
        e.key === "i" ||
        e.key === "J" ||
        e.key === "j" ||
        e.key === "C" ||
        e.key === "c"
      )
    ) {
      e.preventDefault();
      return false;
    }

    if (
      e.ctrlKey &&
      (
        e.key === "U" ||
        e.key === "u"
      )
    ) {
      e.preventDefault();
      return false;
    }

  });


  // ========================================
  // 防止手機手勢縮放
  // ========================================
  document.addEventListener(
    "gesturestart",
    function(e) {
      e.preventDefault();
    },
    { passive: false }
  );

  document.addEventListener(
    "gesturechange",
    function(e) {
      e.preventDefault();
    },
    { passive: false }
  );

  document.addEventListener(
    "gestureend",
    function(e) {
      e.preventDefault();
    },
    { passive: false }
  );


  document.addEventListener(
    "touchmove",
    function(e) {

      if (
        e.touches &&
        e.touches.length > 1
      ) {
        e.preventDefault();
      }

    },
    { passive: false }
  );


  // ========================================
  // 防止手機快速雙擊放大
  // ========================================
  let lastTouchEnd = 0;

  document.addEventListener(
    "touchend",
    function(e) {

      const now = Date.now();

      if (
        now - lastTouchEnd <= 300
      ) {
        e.preventDefault();
      }

      lastTouchEnd = now;

    },
    { passive: false }
  );


  // ========================================
  // 網頁載入完成
  // ========================================
  document.addEventListener(
    "DOMContentLoaded",
    function() {

      const uidInput =
        document.getElementById("uid");

      const queryButton =
        document.querySelector(".btn-query");


      // 點擊輸入框清空
      uidInput.addEventListener(
        "click",
        function() {
          this.value = "";
        }
      );


      // ====================================
      // 不在網頁載入時讀取 API
      //
      // 改成每次按查詢時讀取
      // ====================================

    }
  );


  // ========================================
  // 會員查詢
  // ========================================
  async function showHint(str) {

    const errorMsg =
      document.getElementById(
        "error_message"
      );

    const loadingSpan =
      document.getElementById(
        "loading"
      );

    const orderStatus =
      document.getElementById(
        "order_status"
      );

    const currentTimeSpan =
      document.getElementById(
        "current_time"
      );

    const noticeBox =
      document.getElementById(
        "notice_box"
      );

    const queryButton =
      document.querySelector(".btn-query");


    // ====================================
    // 清除前後空白
    // ====================================
    str = str.trim();


    // ====================================
    // 沒有輸入
    // ====================================
    if (str === "") {

      errorMsg.innerText =
        "請輸入 會員號＋貴賓本名";

      orderStatus.innerHTML = "";

      currentTimeSpan.innerText = "";

      noticeBox.style.display =
        "none";

      return;

    }


    // ====================================
    // 防止連續重複查詢
    // ====================================
    if (queryButton.disabled) {
      return;
    }


    // ====================================
    // 開始查詢
    // 按鈕立即鎖定
    // ====================================
    queryButton.disabled = true;

    errorMsg.innerText = "";

    loadingSpan.style.display =
      "inline-block";

    orderStatus.innerHTML = "";

    currentTimeSpan.innerText = "";

    noticeBox.style.display =
      "none";


    try {

      // ==================================
      // 每次查詢重新讀取 API 設定
      // ==================================
      const configResponse =
        await fetch(
          "/j808/API/J.json?v=" + Date.now(),
          {
            method: "GET",
            cache: "no-store"
          }
        );


      if (!configResponse.ok) {

        throw new Error(
          "API_CONFIG_LOAD_ERROR"
        );

      }


      const config =
        await configResponse.json();


      // ==================================
      // 檢查 API 設定
      // ==================================
      if (
        !config ||
        typeof config.apiUrl !== "string" ||
        config.apiUrl.trim() === ""
      ) {

        throw new Error(
          "API_CONFIG_INVALID"
        );

      }


      API_URL =
        config.apiUrl.trim();

      API_READY = true;


      // ==================================
      // GAS 預熱
      // ==================================
      fetch(
        API_URL +
        (API_URL.indexOf("?") === -1 ? "?" : "&") +
        "warmup=true",
        {
          method: "GET",
          mode: "no-cors"
        }
      )
      .catch(function() {});


      // ==================================
      // 組合 GAS 查詢網址
      // ==================================
      const separator =
        API_URL.indexOf("?") === -1
          ? "?"
          : "&";


      const requestUrl =
        API_URL +
        separator +
        "uid=" +
        encodeURIComponent(str);


      // ==================================
      // 呼叫 GAS
      // ==================================
      const response =
        await fetch(
          requestUrl,
          {
            method: "GET",
            cache: "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          "GAS_REQUEST_ERROR"
        );

      }


      // ==================================
      // 讀取 JSON
      // ==================================
      const result =
        await response.json();


      // ==================================
      // 查無會員
      // ==================================
      if (!result.success) {

        errorMsg.innerText =
          result.message ||
          "查無會員";

        orderStatus.innerHTML = "";

        currentTimeSpan.innerText = "";

        noticeBox.style.display =
          "none";

        return;

      }


      // ==================================
      // 取得點數
      // ==================================
      const points =
        result.points;


      // ==================================
      // 顯示結果
      // ==================================
      orderStatus.innerHTML =
        "<table>" +

          "<tr>" +

            "<th>會員</th>" +

            "<th>目前點數</th>" +

          "</tr>" +

          "<tr>" +

            "<td>" +
            escapeHtml(
              String(result.uid)
            ) +
            "</td>" +

            "<td>" +
            escapeHtml(
              String(points)
            ) +
            "</td>" +

          "</tr>" +

        "</table>";


      // ==================================
      // 查詢時間
      // ==================================
      const now =
        new Date();


      const formattedTime =
        now.getFullYear() +
        "/" +
        String(
          now.getMonth() + 1
        ).padStart(2, "0") +
        "/" +
        String(
          now.getDate()
        ).padStart(2, "0") +
        " " +
        String(
          now.getHours()
        ).padStart(2, "0") +
        ":" +
        String(
          now.getMinutes()
        ).padStart(2, "0") +
        ":" +
        String(
          now.getSeconds()
        ).padStart(2, "0");


      currentTimeSpan.innerText =
        "查詢時間：" +
        formattedTime;


      // ==================================
      // 顯示提醒
      // ==================================
      noticeBox.style.display =
        "block";


    } catch (error) {

      console.error(
        "API 查詢錯誤：",
        error
      );


      errorMsg.innerText =
        "連線伺服器失敗，請稍後再試";


      orderStatus.innerHTML = "";

      currentTimeSpan.innerText = "";

      noticeBox.style.display =
        "none";

    } finally {

      // ==================================
      // 查詢完成
      // 不論成功、查無會員、錯誤
      // 都恢復查詢按鈕
      // ==================================
      loadingSpan.style.display =
        "none";

      queryButton.disabled = false;

      API_READY = false;
      API_URL = "";

    }

  }


  // ========================================
  // 防止內容直接插入 HTML
  // ========================================
  function escapeHtml(value) {

    return value
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }

</script>

  </head>

  <body>

    <div class="container">

      <h2>金正旺VIP查詢系統</h2>

      <div class="input-group">

        <input type="text" id="uid" placeholder="請輸入 會號+貴賓本名" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />

        <button class="btn btn-query" onclick="showHint(document.getElementById('uid').value);">
          查詢
        </button>

      </div>

      <span id="loading" class="loading">讀取中</span>

      <span id="error_message"></span>

      <div id="order_status"></div>

      <span id="current_time"></span>

      <div id="notice_box" class="notice-box" style="display: none;">

        🔔 貼心提醒：<br>
        當日消費之點數，將於【隔日】統一入點唷～

      </div>

      <a class="btn btn-line" href="https://line.me/R/ti/p/@goldwon888?from=page&searchId=goldwon888" target="_blank">
        返回 官方LINE@
      </a>

    </div>

    <div class="copyright">Copyright © 2026 ｊLINE: jimi102</div>

  </body>
</html>
