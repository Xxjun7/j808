  <script>

    // ========================================
    // 官方 LINE@
    // ========================================

    const OFFICIAL_LINE_URL =
      "https://line.me/R/ti/p/@goldwon888";


    // ========================================
    // 全域 API
    // ========================================

    let API_URL = "";

    let API_READY = false;


    // ========================================
    // 目前會員
    // ========================================

    let CURRENT_UID = "";

    let CURRENT_POINTS = "";


    // ========================================
    // 兌換按鈕目前是否正在處理
    //
    // ★ 防止連點
    // ★ 點擊後直到點數同步完成前
    // ★ 絕對不能再次執行
    // ========================================

    let REWARD_OPENING = false;


    // ========================================
    // 獎品快取
    // ========================================

    let REWARDS_CACHE = [];

    let REWARDS_LOADING_PROMISE = null;

    let REWARDS_READY = false;

    let REWARDS_ERROR = "";


    // ========================================
    // 多選獎品
    // ========================================

    let SELECTED_REWARDS = {};


    // ========================================
    // 判斷是否為分類分界線
    // ========================================

    function isRewardCategory(
      reward
    ) {

      const value =
        String(
          reward || ""
        ).trim();


      if (
        value === ""
      ) {

        return false;

      }


      return /^-{2,}.+-{2,}$/.test(
        value
      );

    }


    // ========================================
    // 取得獎品點數
    // ========================================

    function getRewardPoints(
      reward
    ) {

      const text =
        String(
          reward || ""
        );


      const match =
        text.match(
          /(\d+(?:\.\d+)?)\s*點/
        );


      if (
        !match
      ) {

        return null;

      }


      return Number(
        match[1]
      );

    }


    // ========================================
    // 取得目前點數
    // ========================================

    function getCurrentPointsNumber() {

      const points =
        Number(
          String(
            CURRENT_POINTS
          )
          .replace(
            /,/g,
            ""
          )
        );


      if (
        Number.isFinite(points)
      ) {

        return points;

      }


      return 0;

    }


    // ========================================
    // 計算已選獎品總點數
    // ========================================

    function calculateRewardPoints() {

      let total =
        0;


      let hasInvalidPrice =
        false;


      Object.keys(
        SELECTED_REWARDS
      ).forEach(
        function(reward) {

          if (
            isRewardCategory(
              reward
            )
          ) {

            return;

          }


          const price =
            getRewardPoints(
              reward
            );


          const quantity =
            Number(
              SELECTED_REWARDS[
                reward
              ]
            ) || 0;


          if (
            price === null
          ) {

            hasInvalidPrice =
              true;

            return;

          }


          total +=
            price *
            quantity;

        }
      );


      return {
        total: total,
        hasInvalidPrice: hasInvalidPrice
      };

    }


    // ========================================
    // 產生點數扣除算式
    // ========================================

    function buildPointsCalculation() {

      const rewards =
        Object.keys(
          SELECTED_REWARDS
        ).filter(
          function(reward) {

            return !isRewardCategory(
              reward
            );

          }
        );


      const currentPoints =
        getCurrentPointsNumber();


      if (
        rewards.length === 0
      ) {

        return {
          text:
            String(
              currentPoints
            ),

          insufficient:
            false,

          hasInvalidPrice:
            false
        };

      }


      const calculation =
        calculateRewardPoints();


      if (
        calculation.hasInvalidPrice
      ) {

        return {
          text:
            "部分獎品點數資料錯誤",

          insufficient:
            true,

          hasInvalidPrice:
            true
        };

      }


      const deductions =
        [];


      rewards.forEach(
        function(reward) {

          const price =
            getRewardPoints(
              reward
            );


          const quantity =
            Number(
              SELECTED_REWARDS[
                reward
              ]
            ) || 0;


          for (
            let i = 0;
            i < quantity;
            i++
          ) {

            deductions.push(
              String(
                price
              )
            );

          }

        }
      );


      const remaining =
        currentPoints -
        calculation.total;


      const expression =
        String(
          currentPoints
        ) +
        (
          deductions.length > 0
            ? " - " +
              deductions.join(
                " - "
              )
            : ""
        );


      if (
        remaining < 0
      ) {

        return {
          text:
            expression +
            " = 點數不足",

          insufficient:
            true,

          hasInvalidPrice:
            false
        };

      }


      return {
        text:
          expression +
          " = " +
          remaining,

        insufficient:
          false,

        hasInvalidPrice:
          false
      };

    }


    // ========================================
    // 是否可以分享
    // ========================================

    function canSendReward() {

      const rewards =
        Object.keys(
          SELECTED_REWARDS
        ).filter(
          function(reward) {

            return !isRewardCategory(
              reward
            );

          }
        );


      if (
        !CURRENT_UID ||
        rewards.length === 0
      ) {

        return false;

      }


      const calculation =
        calculateRewardPoints();


      if (
        calculation.hasInvalidPrice
      ) {

        return false;

      }


      const currentPoints =
        getCurrentPointsNumber();


      if (
        calculation.total >
        currentPoints
      ) {

        return false;

      }


      return true;

    }


    // ========================================
    // 更新分享按鈕狀態
    // ========================================

    function updateSendButtonState() {

      const sendButton =
        document.getElementById(
          "send_line_button"
        );


      if (
        !sendButton
      ) {

        return;

      }


      if (
        sendButton.dataset.mode ===
        "return-line"
      ) {

        sendButton.disabled =
          false;

        return;

      }


      sendButton.disabled =
        !canSendReward();

    }


    // ========================================
    // ★ 更新「兌換獎品」按鈕狀態
    //
    // disabled = true
    // 代表正在同步點數 / 讀取獎品
    //
    // disabled = false
    // 代表目前可以重新點擊
    // ========================================

    function setRewardButtonDisabled(
      disabled
    ) {

      const rewardButton =
        document.querySelector(
          ".btn-reward"
        );


      if (
        !rewardButton
      ) {

        return;

      }

    // ========================================
    // 讀取 API 設定
    // ========================================

    async function getApiUrl() {

      if (
        API_URL
      ) {

        return API_URL;

      }


      const configResponse =
        await fetch(
          "/j808/API/J.json?v=" +
          Date.now(),
          {
            method: "GET",
            cache: "no-store"
          }
        );


      if (
        !configResponse.ok
      ) {

        throw new Error(
          "API_CONFIG_LOAD_ERROR"
        );

      }


      const config =
        await configResponse.json();


      if (
        !config ||
        typeof config.apiUrl !== "string" ||
        config.apiUrl.trim() === ""
      ) {

        throw new Error(
          "API_CONFIG_INVALID"
        );

      }


      API_URL =
        config.apiUrl.trim();


      return API_URL;

    }


    // ========================================
    // 讀取獎品
    // ========================================

    async function preloadRewards() {

      if (
        REWARDS_READY
      ) {

        return REWARDS_CACHE;

      }


      if (
        REWARDS_LOADING_PROMISE
      ) {

        return REWARDS_LOADING_PROMISE;

      }


      REWARDS_ERROR =
        "";


      REWARDS_LOADING_PROMISE =
        (async function() {

          try {

            const apiUrl =
              await getApiUrl();


            const separator =
              apiUrl.indexOf("?") === -1
                ? "?"
                : "&";


            const rewardUrl =
              apiUrl +
              separator +
              "action=rewards";


            const response =
              await fetch(
                rewardUrl,
                {
                  method: "GET",
                  cache: "no-store"
                }
              );


            if (
              !response.ok
            ) {

              throw new Error(
                "REWARD_REQUEST_ERROR"
              );

            }


            const result =
              await response.json();


            if (
              !result.success
            ) {

              throw new Error(
                result.message ||
                "獎品讀取失敗"
              );

            }


            const rewards =
              Array.isArray(
                result.rewards
              )
                ? result.rewards
                    .map(
                      function(reward) {

                        return String(
                          reward
                        );

                      }
                    )
                    .filter(
                      function(reward) {

                        return reward.trim() !== "";

                      }
                    )
                : [];


            REWARDS_CACHE =
              rewards;


            REWARDS_READY =
              true;


            REWARDS_ERROR =
              "";


            updateRewardReadyStatus();


            return REWARDS_CACHE;


          } catch (err) {

            console.error(
              "獎品讀取錯誤：",
              err
            );


            REWARDS_READY =
              false;


            REWARDS_ERROR =
              "獎品讀取失敗";


            updateRewardReadyStatus();


            throw err;


          } finally {

            REWARDS_LOADING_PROMISE =
              null;

          }

        })();


      return REWARDS_LOADING_PROMISE;

    }

    function fillRewardSelect(
      rewards
    ) {

      const select =
        document.getElementById(
          "reward_select"
        );


      if (
        !select
      ) {

        return;

      }


      select.innerHTML =
        "";


      const defaultOption =
        document.createElement(
          "option"
        );


      defaultOption.value =
        "";


      defaultOption.textContent =
        "-- 點此選擇品項直接加入 --";


      select.appendChild(
        defaultOption
      );


      rewards.forEach(
        function(reward) {

          const option =
            document.createElement(
              "option"
            );


          const category =
            isRewardCategory(
              reward
            );


          if (
            category
          ) {

            option.value =
              "";


            option.textContent =
              reward;


            option.disabled =
              true;


            option.className =
              "reward-category";


          } else {

            option.value =
              reward;


            option.textContent =
              reward;

          }


          select.appendChild(
            option
          );

        }
      );

    }

    // ========================================
    // 開啟兌換獎品
    //
    // ★ 重要：
    // ★ 點擊後立即鎖住按鈕
    // ★ 等最新點數同步完成
    // ★ 才允許再次點擊
    // ========================================

    async function openRewardModal() {

      /*
        ★ 防止快速連點
        ★ 如果前一次還沒完成，直接不執行
      */

      if (
        REWARD_OPENING
      ) {

        return;

      }


      if (
        !CURRENT_UID
      ) {

        return;

      }


      const rewardButton =
        document.querySelector(
          ".btn-reward"
        );


      /*
        ★ 立即禁止按鈕
      */

      REWARD_OPENING =
        true;


      setRewardButtonDisabled(
        true
      );


      const modal =
        document.getElementById(
          "reward_modal"
        );


      const loading =
        document.getElementById(
          "reward_loading"
        );


      const error =
        document.getElementById(
          "reward_error"
        );


      try {

        // ========================================
        // 開啟 Modal 前先同步最新點數
        // ========================================

        error.innerText =
          "正在同步最新點數...";


        const pointsSynced =
          await syncCurrentMemberPoints();


        /*
          ★ 點數還沒拿到結果
          ★ 就絕對不進入下一步
        */

        if (
          !pointsSynced
        ) {

          error.innerText =
            "目前點數更新失敗，請稍後再試";


          return;

        }


        // ========================================
        // 點數同步成功
        // ========================================

        SELECTED_REWARDS =
          {};


        resetRewardShareButton();


        renderSelectedRewards();


        error.innerText =
          "";


        modal.style.display =
          "flex";


        // ========================================
        // 獎品已經讀取完成
        // ========================================

        if (
          REWARDS_READY
        ) {

          loading.style.display =
            "none";


          fillRewardSelect(
            REWARDS_CACHE
          );


          if (
            REWARDS_CACHE.length === 0
          ) {

            error.innerText =
              "目前沒有可兌換的獎品";

          }


          updatePointsCalculation();


          updateRewardPreview();


          updateSendButtonState();


          return;

        }


        // ========================================
        // 尚未讀取獎品
        // ========================================

        loading.style.display =
          "block";


        try {

          const rewards =
            await preloadRewards();


          loading.style.display =
            "none";


          fillRewardSelect(
            rewards
          );


          if (
            rewards.length === 0
          ) {

            error.innerText =
              "目前沒有可兌換的獎品";

          }


          updatePointsCalculation();


          updateRewardPreview();


          updateSendButtonState();


        } catch (err) {

          console.error(
            "開啟獎品時讀取錯誤：",
            err
          );


          loading.style.display =
            "none";


          error.innerText =
            "獎品讀取失敗，請稍後再試";

        }


      } finally {

        /*
          ★ 整個開啟流程結束
          ★ 才解除 REWARD_OPENING
          ★ 按鈕才恢復可以點
        */

        REWARD_OPENING =
          false;


        /*
          ★ 只有還有會員資料時才恢復
          ★ 如果查詢已經被其他操作清掉，就維持禁止
        */

        if (
          CURRENT_UID
        ) {

          setRewardButtonDisabled(
            false
          );

        } else {

          setRewardButtonDisabled(
            true
          );

        }

      }

    }


    // ========================================
    // 選單選擇獎品
    // ========================================

    function addRewardFromSelect() {

      const select =
        document.getElementById(
          "reward_select"
        );


      const reward =
        select.value;


      if (
        !reward
      ) {

        return;

      }


      if (
        isRewardCategory(
          reward
        )
      ) {

        select.value =
          "";


        return;

      }


      if (
        Object.prototype.hasOwnProperty.call(
          SELECTED_REWARDS,
          reward
        )
      ) {

        SELECTED_REWARDS[reward] +=
          1;

      } else {

        SELECTED_REWARDS[reward] =
          1;

      }


      const sendButton =
        document.getElementById(
          "send_line_button"
        );


      if (
        sendButton &&
        sendButton.dataset.mode !==
        "return-line"
      ) {

        sendButton.dataset.mode =
          "share";

        sendButton.innerText =
          "💬 分享給官方 LINE@";

      }


      renderSelectedRewards();


      select.value =
        "";

    }
    
        // ========================================
    // 增加數量
    // ========================================

    function increaseReward(
      reward
    ) {

      if (
        isRewardCategory(
          reward
        )
      ) {

        return;

      }


      if (
        !Object.prototype.hasOwnProperty.call(
          SELECTED_REWARDS,
          reward
        )
      ) {

        SELECTED_REWARDS[reward] =
          1;

      } else {

        SELECTED_REWARDS[reward] +=
          1;

      }


      renderSelectedRewards();

    }


    // ========================================
    // 減少數量
    // ========================================

    function decreaseReward(
      reward
    ) {

      if (
        isRewardCategory(
          reward
        )
      ) {

        return;

      }


      if (
        !Object.prototype.hasOwnProperty.call(
          SELECTED_REWARDS,
          reward
        )
      ) {

        return;

      }


      SELECTED_REWARDS[reward] -=
        1;


      if (
        SELECTED_REWARDS[reward] <= 0
      ) {

        delete SELECTED_REWARDS[
          reward
        ];

      }


      renderSelectedRewards();

    }


    // ========================================
    // 移除獎品
    // ========================================

    function removeReward(
      reward
    ) {

      if (
        isRewardCategory(
          reward
        )
      ) {

        return;

      }


      delete SELECTED_REWARDS[
        reward
      ];


      renderSelectedRewards();

    }


    // ========================================
    // 顯示已選獎品
    // ========================================

    function renderSelectedRewards() {

      const box =
        document.getElementById(
          "selectedItemsBox"
        );


      const sendButton =
        document.getElementById(
          "send_line_button"
        );


      box.innerHTML =
        "";


      Object.keys(
        SELECTED_REWARDS
      ).forEach(
        function(reward) {

          if (
            isRewardCategory(
              reward
            )
          ) {

            delete SELECTED_REWARDS[
              reward
            ];

          }

        }
      );


      const rewards =
        Object.keys(
          SELECTED_REWARDS
        );


      if (
        rewards.length === 0
      ) {

        box.innerHTML =

          '<div class="selected-empty">' +

          '尚未選擇任何獎品' +

          '</div>';


        updatePointsCalculation();


        updateRewardPreview();


        if (
          sendButton &&
          sendButton.dataset.mode !==
          "return-line"
        ) {

          sendButton.disabled =
            true;

        } else {

          updateSendButtonState();

        }


        return;

      }


      rewards.forEach(
        function(reward) {

          const quantity =
            SELECTED_REWARDS[
              reward
            ];


          const item =
            document.createElement(
              "div"
            );


          item.className =
            "selected-item";


          const name =
            document.createElement(
              "div"
            );


          name.className =
            "selected-item-name";


          name.innerText =
            reward;


          const quantityControl =
            document.createElement(
              "div"
            );


          quantityControl.className =
            "quantity-control";


          const minus =
            document.createElement(
              "button"
            );


          minus.type =
            "button";


          minus.className =
            "quantity-btn";


          minus.innerText =
            "−";


          minus.onclick =
            function() {

              decreaseReward(
                reward
              );

            };


          const number =
            document.createElement(
              "span"
            );


          number.className =
            "quantity-number";


          number.innerText =
            quantity;


          const plus =
            document.createElement(
              "button"
            );


          plus.type =
            "button";


          plus.className =
            "quantity-btn";


          plus.innerText =
            "+";


          plus.onclick =
            function() {

              increaseReward(
                reward
              );

            };


          quantityControl.appendChild(
            minus
          );


          quantityControl.appendChild(
            number
          );


          quantityControl.appendChild(
            plus
          );


          const remove =
            document.createElement(
              "button"
            );


          remove.type =
            "button";


          remove.className =
            "remove-item";


          remove.innerText =
            "✕";


          remove.title =
            "移除";


          remove.onclick =
            function() {

              removeReward(
                reward
              );

            };


          item.appendChild(
            name
          );


          item.appendChild(
            quantityControl
          );


          item.appendChild(
            remove
          );


          box.appendChild(
            item
          );

        }
      );


      updatePointsCalculation();


      updateRewardPreview();


      updateSendButtonState();

    }


    // ========================================
    // 更新點數計算
    // ========================================

    function updatePointsCalculation() {

      const calculationBox =
        document.getElementById(
          "points_calculation"
        );


      if (
        !calculationBox
      ) {

        return;

      }


      const result =
        buildPointsCalculation();


      calculationBox.innerText =
        result.text;


      calculationBox.classList.remove(
        "insufficient"
      );


      calculationBox.classList.remove(
        "sufficient"
      );


      if (
        result.insufficient
      ) {

        calculationBox.classList.add(
          "insufficient"
        );

      } else {

        calculationBox.classList.add(
          "sufficient"
        );

      }


      updateSendButtonState();

    }


    // ========================================
    // 建立分享文字
    // ========================================

    function buildRewardMessage() {

      const rewards =
        Object.keys(
          SELECTED_REWARDS
        ).filter(
          function(reward) {

            return !isRewardCategory(
              reward
            );

          }
        );


      const pointsResult =
        buildPointsCalculation();


      let message =

        "🎁 兌換獎品" +
        "\n\n";


      message +=

        "會員：" +
        CURRENT_UID +
        "\n";


      message +=

        "目前點數 : " +
        CURRENT_POINTS +
        "\n";


      message +=

        " " +
        pointsResult.text +
        "\n";


      message +=
        "\n";


      message +=
        "兌換品項：";


      rewards.forEach(
        function(reward, index) {

          message +=

            "\n" +
            (index + 1) +
            ". " +
            reward +
            " × " +
            SELECTED_REWARDS[
              reward
            ];

        }
      );


      message +=

        "\n\n" +
        "請協助是否有貨確認兌換，謝謝。";


      return message;

    }


    // ========================================
    // 即時預覽
    // ========================================

    function updateRewardPreview() {

      const preview =
        document.getElementById(
          "reward_preview"
        );


      if (
        !preview
      ) {

        return;

      }


      const rewards =
        Object.keys(
          SELECTED_REWARDS
        ).filter(
          function(reward) {

            return !isRewardCategory(
              reward
            );

          }
        );


      if (
        rewards.length === 0
      ) {

        preview.innerText =
          "尚未選擇兌換品項";


        return;

      }


      preview.innerText =
        buildRewardMessage();

    }


    // ========================================
    // LINE 分享
    // ========================================

    function sendRewardToLine() {

      const sendButton =
        document.getElementById(
          "send_line_button"
        );


      if (
        sendButton &&
        sendButton.dataset.mode ===
        "return-line"
      ) {

        window.open(
          OFFICIAL_LINE_URL,
          "_blank"
        );


        return;

      }


      const rewards =
        Object.keys(
          SELECTED_REWARDS
        ).filter(
          function(reward) {

            return !isRewardCategory(
              reward
            );

          }
        );


      if (
        !CURRENT_UID ||
        rewards.length === 0
      ) {

        return;

      }


      if (
        !canSendReward()
      ) {

        updatePointsCalculation();

        return;

      }


      const message =
        buildRewardMessage();


      const lineShareUrl =
        "https://line.me/R/share?text=" +
        encodeURIComponent(
          message
        );


      window.open(
        lineShareUrl,
        "_blank"
      );


      if (
        sendButton
      ) {

        sendButton.innerText =
          "返回 官方LINE@";


        sendButton.className =
          "btn-send-line";


        sendButton.disabled =
          false;


        sendButton.dataset.mode =
          "return-line";

      }

    }


    // ========================================
    // 關閉 Modal
    // ========================================

    function closeRewardModal() {

      const modal =
        document.getElementById(
          "reward_modal"
        );


      if (
        modal
      ) {

        modal.style.display =
          "none";

      }

    }


    // ========================================
    // Modal 背景關閉
    // ========================================

    function rewardModalBackgroundClick(
      event
    ) {

      if (
        event.target.id ===
        "reward_modal"
      ) {

        closeRewardModal();

      }

    }


    // ========================================
    // HTML 安全處理
    // ========================================

    function escapeHtml(value) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }

  </script>

</head>

<body>

  <!-- ======================================
       主畫面
       ====================================== -->

  <div class="container">

<h2>
  金正旺VIP查詢系統
</h2>


<div class="input-group">

  <input

<span

<span

  id="order_status"
></div>


<span

></span>


<!-- ====================================
     兌換獎品按鈕
     ==================================== -->

<div

>

  <button
    type="button"

    onclick="openRewardModal();"
  >

  </button>


  <span

  >
    獎品讀取中...
  </span>

</div>


<div

>

  🔔 貼心提醒：<br>

  當日消費之點數，
  將於【隔日】統一入點唷～

</div>


<a
  class="btn btn-line"
  href="https://line.me/R/ti/p/@goldwon888"
  target="_blank"
>
  返回 官方LINE@
</a>

  </div>


  <!-- ======================================
       兌換獎品 Modal
       ====================================== -->

  <div

<div
  class="reward-panel"
>


  <div
    class="reward-title"
  >
    🎁 請選擇兌換獎品
  </div>


  <div

  >

    <span>
      （點擊即可加入，可選多個）
    </span>

  </div>


  <select
    id="reward_select"

  >

    <option value="">

    </option>

  </select>


  <div
    class="selected-title"
  >
    🎁 已選擇品項
  </div>


  <div
    id="selectedItemsBox"
  >

    <div
      class="selected-empty"
    >
      尚未選擇任何獎品
    </div>

  </div>


  <div
    class="points-box"
  >

    <div

    >

    <div

    >

    </div>

  </div>


  <div
    class="preview-box"
  >

    <div
      class="preview-title"
    >
      👀 即時預覽
    </div>


    <div
      id="reward_preview"
    >
      尚未選擇兌換品項
    </div>

  </div>


  <div

  </div>


  <div

  <div

  >

      data-mode="share"
      onclick="sendRewardToLine();"
    >
      💬 分享給官方 LINE@
    </button>


  </div>


</div>

  </div>


  <div
    class="copyright"
  >
    Copyright © 2026 ｊLINE: jimi102
  </div>
