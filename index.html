<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>USD 即期賣出</title>
</head>
<body>

<div id="rate">讀取中...</div>

<script>
async function getUsdSpotSell() {
    const res = await fetch("https://www.bot.com.tw/api/Market/Query/ExRate");
    const json = await res.json();

    const usd = json.data.find(item => item.curCode === "USD");

    document.getElementById("rate").textContent = usd.sSpot;
}

getUsdSpotSell();
</script>

</body>
</html>
