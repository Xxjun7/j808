    * {

    }

        Arial,

      color: #ffffff;

      margin: 0;
      padding: 16px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      min-height: 100vh;
      min-height: 100dvh;

      touch-action: pan-x pan-y;

      background-image:

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .container {

      width: 100%;
      max-width: 500px;

      background: rgba(0, 0, 0, 0.65);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      border:
        1px solid
        rgba(255, 255, 255, 0.15);

      padding: 20px;

      border-radius: 16px;

      box-shadow:
        0 8px 32px
        rgba(0, 0, 0, 0.37);

      touch-action: manipulation;
    }

    h2 {

      font-size: 1.4rem;

      margin-top: 0;
      margin-bottom: 20px;

      text-align: center;

      letter-spacing: 1.5px;

      font-weight: bold;

      background:
        linear-gradient(
          90deg,
          #bf953f,
          #fcf6ba,
          #b38728,
          #fbf5b7,
          #aa771c
        );

      background-size: 200% auto;

      color: transparent;

      -webkit-background-clip: text;
      background-clip: text;

      animation:
        shine 3s linear infinite;

      text-shadow:
        0 0 15px
        rgba(212, 175, 55, 0.4);
    }


    @keyframes shine {

      to {
        background-position: 200% center;
      }

    }

    .input-group {

      display: flex;

      gap: 8px;

      margin-bottom: 12px;
    }


    input[type="text"] {

      flex: 1;

      min-width: 0;

      padding: 12px;

      font-size: 16px;

      border:
        1px solid
        rgba(255, 255, 255, 0.3);

      background:
        rgba(255, 255, 255, 0.1);

      color: #ffffff;

      border-radius: 8px;

      outline: none;

      -webkit-appearance: none;

      -webkit-user-select: text;
      user-select: text;

      touch-action: manipulation;
    }


    input[type="text"]::placeholder {

      color:
        rgba(255, 255, 255, 0.6);
    }


    input[type="text"]:focus {

      border-color:
        #fcf6ba;

      background:
        rgba(255, 255, 255, 0.15);
    }

    button,
    .btn {

      padding: 12px 16px;

      font-size: 1rem;

      font-weight: 500;

      border: none;

      border-radius: 8px;

      cursor: pointer;

      text-decoration: none;

      display: inline-block;

      text-align: center;

      touch-action: manipulation;
    }


    button:active,
    .btn:active {

      transform: scale(0.98);
    }


    button:disabled,
    .btn:disabled {

      cursor: not-allowed;

      opacity: 0.6;

      filter: grayscale(30%);

      pointer-events: none;
    }

    .btn-query {

      background:
        linear-gradient(
          135deg,
          #bf953f,
          #fcf6ba,
          #aa771c
        );

      color: #222222;

      font-weight: bold;

      box-shadow:
        0 0 10px
        rgba(212, 175, 55, 0.4);

      animation:
        breathe 2.5s ease-in-out infinite;
    }


    .btn-query:disabled {

      cursor: not-allowed;

      opacity: 0.6;

      filter: grayscale(30%);

      pointer-events: none;
    }


    @keyframes breathe {

      0%,
      100% {

        box-shadow:
          0 0 5px
          rgba(212, 175, 55, 0.3);

        filter: brightness(0.95);
      }

      50% {

        box-shadow:
          0 0 18px
          rgba(252, 246, 186, 0.8);

        filter: brightness(1.08);
      }

    }

    .loading {

      display: none;

      font-size: 0.95rem;

      color: #fcf6ba;

      margin-top: 8px;
    }


    .loading::after {

      content: '';

      display: inline-block;

      animation:
        dots 1.5s infinite
        steps(4, end);
    }


    @keyframes dots {

      0% {
        content: '';
      }

      25% {
        content: '.';
      }

      50% {
        content: '..';
      }

      75% {
        content: '...';
      }

    }

    #error_message {

      color: #ff6b6b;

      font-size: 0.9rem;

      margin-top: 4px;

      display: block;
    }

    #current_time {

      display: block;

      margin-top: 16px;

      font-size: 0.9rem;

      background-image:
        linear-gradient(
          to right,
          #ee9ca7,
          #ffdde1
        );

      -webkit-background-clip: text;

      color: transparent;

      font-weight: bold;
    }

    .notice-box {

      margin-top: 12px;

      padding: 10px 12px;

      background:
        rgba(255, 255, 255, 0.08);

      border-left:
        3px solid
        #fcf6ba;

      border-radius: 4px;

      font-size: 0.88rem;

      line-height: 1.5;

      color: #fceea7;
    }

    #order_status {

      width: 100%;

      margin-top: 16px;

      overflow-x: auto;
    }


    #order_status table {

      width: 100%;

      border-collapse: collapse;

      margin-top: 8px;
    }


    #order_status th,
    #order_status td {

      border:
        1px solid
        rgba(255, 255, 255, 0.2);

      padding: 8px;

      text-align: center;

      font-size: 0.95rem;

      color: #ffffff;

      background:
        rgba(255, 255, 255, 0.05);
    }


    #order_status th {

      background:
        rgba(255, 255, 255, 0.15);
    }

    #reward_button_area {

      display: none;

      margin-top: 14px;

      text-align: center;
    }


    .btn-reward {

      width: 100%;

      background:
       linear-gradient(
        135deg,
        #bf953f,
        #fcf6ba,
        #aa771c
       );

      color: #222222;

      font-weight: bold;

      box-shadow:
        0 0 10px
        rgba(212, 175, 55, 0.4);

      animation:
        breathe 2.5s ease-in-out infinite;
    }


    .btn-reward:disabled {

      cursor: not-allowed;

      opacity: 0.6;

      filter: grayscale(30%);

      pointer-events: none;

      animation: none;

      box-shadow: none;
    }

    .reward-ready-text {

      display: block;

      margin-top: 6px;

      font-size: 0.78rem;

      color:
        rgba(255, 255, 255, 0.55);
    }


    .reward-ready-text.ready {

      color: #8ff0a4;
    }


    .reward-ready-text.error {

      color: #ff8b8b;
    }

    .btn-line {

      background-color:
        #00c300;

      color: #ffffff;

      margin-top: 16px;
    }


    .btn-line:hover {

      background-color:
        #00b000;
    }

    #reward_modal {

      display: none;

      position: fixed;

      inset: 0;

      z-index: 5000;

      background:
        rgba(0, 0, 0, 0.78);

      padding: 18px;

      align-items: center;

      justify-content: center;
    }


    .reward-panel {

      width: 100%;

      max-width: 450px;

      max-height: 90vh;

      overflow-y: auto;

      background:
        rgba(20, 20, 20, 0.98);

      border:
        1px solid
        rgba(255, 255, 255, 0.18);

      border-radius: 18px;

      padding: 20px;

      box-shadow:
        0 15px 45px

    .reward-title {

      font-weight: bold;

      color: #fcf6ba;

      margin-bottom: 18px;
    }

    .reward-label {

      color: #ffffff;

      font-size: 0.95rem;

      margin-bottom: 8px;

      line-height: 1.5;
    }


    .reward-label span {

      color: #fcf6ba;

      font-size: 0.85rem;
    }

    #reward_select {

      width: 100%;

      padding: 13px 12px;

      font-size: 16px;

      border:
        1px solid
        rgba(255, 255, 255, 0.25);

      border-radius: 10px;

      background:
        rgba(255, 255, 255, 0.08);

      color: #ffffff;

      outline: none;

      margin-bottom: 16px;

    #reward_select option {

      background: #222222;

    #reward_select option.reward-category {

      background:
        rgba(255, 255, 255, 0.05);

      text-align: center;
    }

    .selected-item {

      display: flex;

      align-items: center;

      gap: 8px;

      padding: 10px;

      border-radius: 10px;

      background:
        rgba(255, 255, 255, 0.07);

      border:
        1px solid
        rgba(255, 255, 255, 0.12);
    }


    .selected-item-name {

      flex: 1;

      min-width: 0;

      color: #ffffff;

      font-size: 0.92rem;

      word-break: break-word;
    }

    .quantity-control {

      display: flex;

      align-items: center;

      gap: 5px;

      flex-shrink: 0;
    }


    .quantity-btn {

      width: 30px;

      height: 30px;

      padding: 0;

      border-radius: 7px;

      background:
        rgba(212, 175, 55, 0.22);

      color: #fcf6ba;

      border:
        1px solid
        rgba(252, 246, 186, 0.35);

      font-size: 1.1rem;

      font-weight: bold;

      line-height: 30px;
    }


    .quantity-number {

      min-width: 28px;

      text-align: center;

      color: #ffffff;

      font-weight: bold;

      font-size: 0.95rem;
    }

    .remove-item {

      width: 30px;

      height: 30px;

      padding: 0;

      border-radius: 7px;

      background:
        rgba(255, 80, 80, 0.15);

      color: #ff8b8b;

      font-size: 0.95rem;

      flex-shrink: 0;
    }

    .points-box {

      margin-top: 16px;

      padding: 12px 14px;

      border-radius: 12px;

      background:
        rgba(255, 255, 255, 0.06);

      border:
        1px solid
        rgba(255, 255, 255, 0.12);

      line-height: 1.6;
    }


    .points-title {

      color: #fcf6ba;

      font-size: 0.95rem;

      font-weight: bold;

      margin-bottom: 5px;
    }


    #points_calculation {

      color: #ffffff;

      font-size: 0.92rem;

      word-break: break-word;
    }


    #points_calculation.insufficient {

      color: #ff8b8b;

      font-weight: bold;
    }


    #points_calculation.sufficient {

      color: #8ff0a4;

      font-weight: bold;
    }

    .preview-box {

      margin-top: 16px;

      padding: 14px;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          rgba(212, 175, 55, 0.12),
          rgba(255, 255, 255, 0.05)
        );

      border:
        1px solid
        rgba(212, 175, 55, 0.25);
    }


    .preview-title {

      color: #fcf6ba;

      font-size: 0.98rem;

      font-weight: bold;

      margin-bottom: 10px;
    }


    #reward_preview {

      white-space: pre-line;

      color: #ffffff;

      font-size: 0.9rem;

      line-height: 1.65;

      word-break: break-word;
    }

    .reward-actions {

      display: flex;

      gap: 8px;

      margin-top: 18px;
    }


    .reward-actions button {

      flex: 1;

      min-width: 0;
    }


    .btn-close-reward {

      background:
        rgba(255, 255, 255, 0.12);

      color: #ffffff;
    }

    .btn-send-line {

      background:
        #00c300;

      color: #ffffff;

      font-weight: bold;

      box-shadow:
        0 0 10px
        rgba(0, 195, 0, 0.25);
    }


    .btn-send-line:disabled {

      opacity: 0.4;

      cursor: not-allowed;

      box-shadow: none;
    }

    .reward-loading {

      text-align: center;

      color: #fcf6ba;

      padding: 20px 0;
    }
    
        .reward-error {

      text-align: center;

      color: #ff6b6b;

      padding: 10px 0;
    }

    .copyright {

      position: fixed;

      bottom: 8px;

      right: 12px;

      font-size: 0.75rem;

      color:
        rgba(255, 255, 255, 0.5);

      letter-spacing: 0.5px;

      pointer-events: none;

      z-index: 999;
    }

    @media (max-width: 420px) {

      .reward-panel {

        padding: 16px;
      }


      .selected-item {

        flex-wrap: wrap;
      }


      .selected-item-name {

        width: 100%;

        flex-basis: 100%;
      }

    }

<body>

  <div class="container">

<h2>
  金正旺VIP查詢系統
</h2>


<div class="input-group">

  <input
    type="text"
    id="uid"
    placeholder="請輸入 會號+貴賓本名"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="off"
    spellcheck="false"
  >


  <button
    class="btn btn-query"
    onclick="
      showHint(
        document.getElementById('uid').value
      );
    "
  >
    查詢
  </button>

</div>


<span
  id="loading"
  class="loading"
>
  讀取中
</span>


<span
  id="error_message"
></span>


<div
  id="order_status"
></div>


<span
  id="current_time"
></span>

<div
  id="reward_button_area"
>

  <button
    type="button"
    class="btn btn-reward"
    disabled
    onclick="openRewardModal();"
  >
    🎁 兌換獎品
  </button>


  <span
    id="reward_ready_status"
    class="reward-ready-text"
  >
    資料讀取中...
  </span>

</div>


<div
  id="notice_box"
  class="notice-box"
  style="display: none;"
>

  🔔 貼心提醒：<br>

  當日消費之點數，
  將於【隔日】統一入點唷～

</div>


<a
  class="btn btn-line"
  href="https://line.me/R/ti/p/@goldwon888"
  target="_blank"
>
  返回 官方LINE@
</a>

  </div>

  <div
    id="reward_modal"
    onclick="rewardModalBackgroundClick(event);"
  >

<div
  class="reward-panel"
>


  <div
    class="reward-title"
  >
    🎁 請選擇兌換獎品
  </div>


  <div
    class="reward-label"
  >

    選擇品項

    <span>
      （點擊即可加入，可選多個）
    </span>

  </div>


  <select
    id="reward_select"
    onchange="addRewardFromSelect();"
  >

    <option value="">
      -- 點此選擇品項直接加入 --
    </option>

  </select>


  <div
    class="selected-title"
  >
    🎁 已選擇品項
  </div>


  <div
    id="selectedItemsBox"
  >

    <div
      class="selected-empty"
    >
      尚未選擇任何獎品
    </div>

  </div>


  <div
    class="points-box"
  >

    <div
      class="points-title"
    >
      💰 點數計算
    </div>


    <div
      id="points_calculation"
    >
      尚未選擇兌換品項
    </div>

  </div>


  <div
    class="preview-box"
  >

    <div
      class="preview-title"
    >
      👀 即時預覽
    </div>


    <div
      id="reward_preview"
    >
      尚未選擇兌換品項
    </div>

  </div>


  <div
    id="reward_loading"
    class="reward-loading"
    style="display: none;"
  >
    資料讀取中...
  </div>


  <div
    id="reward_error"
    class="reward-error"
  ></div>


  <div
    class="reward-actions"
  >


    <button
      type="button"
      class="btn-close-reward"
      onclick="closeRewardModal();"
    >
      關閉
    </button>


    <button
      type="button"
      id="send_line_button"
      class="btn-send-line"
      disabled
      data-mode="share"
      onclick="sendRewardToLine();"
    >
      💬 分享給官方 LINE@
    </button>


  </div>


</div>

  </div>


  <div
    class="copyright"
  >
    Copyright © 2026 ｊLINE: jimi102
  </div>

</body>

</html>
