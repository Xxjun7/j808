name: Update BOT Exchange Rate

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch BOT exchange rate
        run: |
          curl -L \
            -H "User-Agent: Mozilla/5.0" \
            -H "Accept: application/json" \
            "https://www.bot.com.tw/api/Market/Query/ExRate" \
            -o exchange.json

          echo "=== API Response ==="
          head -20 exchange.json

          USD=$(jq -r '.data[] | select(.curCode=="USD") | .sSpot' exchange.json)

          echo "{ \"usdSpotSell\": $USD }" > rate.json

          cat rate.json

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add rate.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update USD exchange rate"
            git push
          fi
